            - generic [ref=f13e29]:
              - heading "1. 服务概述" [level=2] [ref=f13e30]
              - paragraph [ref=f13e31]: 寻根路（xungenlu.cn）是一个专注于家族文化传承的数字化平台，为global华人家庭提供一站式家谱数字化解决方案。本服务条款详细说明了我们提供的服务内容、使用规则和相关权利义务。
            - generic [ref=f13e32]:
              - heading "2. 服务可用性" [level=2] [ref=f13e33]
              - heading "2.1 服务时间" [level=3] [ref=f13e34]
              - paragraph [ref=f13e35]: 我们努力提供7×24小时不间断服务，但以下情况可能导致服务中断：
              - list [ref=f13e36]:
                - listitem [ref=f13e37]: 定期系统维护和升级（我们会提前公告）
                - listitem [ref=f13e38]: 不可抗力因素（自然灾害、网络攻击等）
                - listitem [ref=f13e39]: 第三方服务故障（电信运营商、云服务商等）
                - listitem [ref=f13e40]: 政府行为或法律法规要求
              - heading "2.2 服务改进" [level=3] [ref=f13e41]
              - paragraph [ref=f13e42]: 我们持续优化产品功能和用户体验，可能随时增加、修改或删除功能。重大功能变更会尽可能提前通知用户。
            - generic [ref=f13e43]:
              - heading "3. 账户与权限" [level=2] [ref=f13e44]
              - heading "3.1 账户类型" [level=3] [ref=f13e45]
              - list [ref=f13e46]:
                - listitem [ref=f13e47]:
                  - strong [ref=f13e48]: 演示账户：
                  - text: 无需注册即可体验，数据在30天后自动清除
                - listitem [ref=f13e49]:
                  - strong [ref=f13e50]: 普通用户：
                  - text: 注册后可创建或加入家族
                - listitem [ref=f13e51]:
                  - strong [ref=f13e52]: 家族管理员（ADMIN）：
                  - text: 管理家族设置、成员权限
                - listitem [ref=f13e53]:
                  - strong [ref=f13e54]: 家族所有者（OWNER）：
                  - text: 拥有家族最高管理权限
              - heading "3.2 权限管理" [level=3] [ref=f13e55]
              - paragraph [ref=f13e56]: 家族管理员可根据需要为成员分配不同权限级别，包括：
              - list [ref=f13e57]:
                - listitem [ref=f13e58]: 查看族谱数据
                - listitem [ref=f13e59]: 编辑族谱信息
                - listitem [ref=f13e60]: 管理家族成员
                - listitem [ref=f13e61]: 审核上传内容
                - listitem [ref=f13e62]: 财务管理等
            - generic [ref=f13e63]:
              - heading "4. 数据管理" [level=2] [ref=f13e64]
              - heading "4.1 数据存储" [level=3] [ref=f13e65]
              - list [ref=f13e66]:
                - listitem [ref=f13e67]: 您的数据存储在中国境内的安全服务器上
                - listitem [ref=f13e68]: 我们采用多重备份机制保障数据安全
                - listitem [ref=f13e69]: 敏感信息加密存储
              - heading "4.2 数据导入导出" [level=3] [ref=f13e70]
              - list [ref=f13e71]:
                - listitem [ref=f13e72]: 支持Excel格式批量导入族谱数据
                - listitem [ref=f13e73]: 支持导出族谱数据（格式包括Excel、GEDCOM等）
                - listitem [ref=f13e74]: 导入数据需符合我们的格式规范
              - heading "4.3 数据删除" [level=3] [ref=f13e75]
              - paragraph [ref=f13e76]: 您可以随时删除自己上传的内容。账户注销后，我们将在30天内删除或匿名化您的个人数据，但以下情况除外：
              - list [ref=f13e77]:
                - listitem [ref=f13e78]: 法律法规要求保留的数据
                - listitem [ref=f13e79]: 与其他用户共享且对方仍需使用的数据（将匿名化处理）
                - listitem [ref=f13e80]: 涉及纠纷调查的数据
            - generic [ref=f13e81]:
              - heading "5. 内容规范" [level=2] [ref=f13e82]
              - heading "5.1 允许的内容" [level=3] [ref=f13e83]
              - list [ref=f13e84]:
                - listitem [ref=f13e85]: 家族历史资料和族谱信息
                - listitem [ref=f13e86]: 家族成员照片和影像资料
                - listitem [ref=f13e87]: 生平传记和家族故事
                - listitem [ref=f13e88]: 其他与家族文化传承相关的内容
              - heading "5.2 禁止的内容" [level=3] [ref=f13e89]
              - list [ref=f13e90]:
                - listitem [ref=f13e91]: 违反法律法规的内容
                - listitem [ref=f13e92]: 侵犯他人知识产权、隐私权的内容
                - listitem [ref=f13e93]: 虚假、误导性信息
                - listitem [ref=f13e94]: 淫秽、暴力、仇恨言论
                - listitem [ref=f13e95]: 商业广告或垃圾信息
                - listitem [ref=f13e96]: 恶意软件或有害代码
              - heading "5.3 内容审核" [level=3] [ref=f13e97]
              - paragraph [ref=f13e98]: 为维护平台健康环境，我们可能审核用户上传的内容。如发现违规内容，我们有权删除并要求用户改正。严重违规者可能被暂停或终止服务。
            - generic [ref=f13e99]:
              - heading "6. 家族协作" [level=2] [ref=f13e100]
              - heading "6.1 家族小组" [level=3] [ref=f13e101]
              - list [ref=f13e102]:
                - listitem [ref=f13e103]: 每个家族可创建独立的家族小组
                - listitem [ref=f13e104]: 家族成员可在小组内共享信息和讨论
                - listitem [ref=f13e105]: 管理员可设置加入条件（如邀请制、审核制）
              - heading "6.2 寻亲归宗" [level=3] [ref=f13e106]
              - list [ref=f13e107]:
                - listitem [ref=f13e108]: 平台提供智能匹配功能帮助失散支系找到根源
                - listitem [ref=f13e109]: 用户可发布寻亲帖或响应他人的寻亲请求
                - listitem [ref=f13e110]: 归宗合并需双方家族管理员确认
              - heading "6.3 隐私保护" [level=3] [ref=f13e111]
              - paragraph [ref=f13e112]: 在世人员的详细信息默认对其他用户隐藏，除非：
              - list [ref=f13e113]:
                - listitem [ref=f13e114]: 您主动设置为可见
                - listitem [ref=f13e115]: 对方通过亲属验证
                - listitem [ref=f13e116]: 同为家族小组成员且被授权查看
            - generic [ref=f13e117]:
              - heading "7. 增值服务" [level=2] [ref=f13e118]
