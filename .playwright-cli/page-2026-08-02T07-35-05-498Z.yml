                - listitem [ref=f13e128]: 高级数据分析报告
                - listitem [ref=f13e129]: 族谱印刷服务
                - listitem [ref=f13e130]: 优先客服支持
                - listitem [ref=f13e131]: 其他增值功能
              - paragraph [ref=f13e132]: 具体价格和套餐以官网公布为准，我们保留调整价格的权利。
            - generic [ref=f13e133]:
              - heading "8. 印刷服务" [level=2] [ref=f13e134]
              - paragraph [ref=f13e135]: 我们提供族谱印刷服务，具体条款如下：
              - list [ref=f13e136]:
                - listitem [ref=f13e137]: 支持多种装订规格（经典宣纸、现代精装、简约风格）
                - listitem [ref=f13e138]: 印刷前提供PDF在线预览确认
                - listitem [ref=f13e139]: 下单后7-15个工作日内发货
                - listitem [ref=f13e140]: 质量问题支持退换货
                - listitem [ref=f13e141]: 具体价格、规格和配送范围以订单页面为准
            - generic [ref=f13e142]:
              - heading "9. 知识产权" [level=2] [ref=f13e143]
              - paragraph [ref=f13e144]: 寻根路平台的所有知识产权（包括但不限于商标、软件代码、界面设计、文档）归我们所有。用户保留对其上传内容的知识产权，但授权我们为提供服务而使用。未经授权，不得将平台内容用于商业目的。
            - generic [ref=f13e145]:
              - heading "10. 责任限制" [level=2] [ref=f13e146]
              - paragraph [ref=f13e147]: 在法律允许的最大范围内，我们对以下情况不承担责任：
              - list [ref=f13e148]:
                - listitem [ref=f13e149]: 因不可抗力导致的服务中断或数据丢失
                - listitem [ref=f13e150]: 用户间因族谱信息产生的争议
                - listitem [ref=f13e151]: 第三方服务故障造成的影响
                - listitem [ref=f13e152]: 用户违反本协议造成的后果
              - paragraph [ref=f13e153]: 我们的总赔偿责任不超过您在过去12个月内实际支付的服务费用。
            - generic [ref=f13e154]:
              - heading "11. 条款变更" [level=2] [ref=f13e155]
              - paragraph [ref=f13e156]: 我们可能根据业务发展或法律法规变化修改本条款。重大变更会提前30天通过站内通知、短信或邮件告知。如您在变更后继续使用服务，即视为接受修改后的条款。
            - generic [ref=f13e157]:
              - heading "12. 联系我们" [level=2] [ref=f13e158]
              - paragraph [ref=f13e159]: 如果您对本条款有任何疑问或需要帮助，请通过以下方式联系我们：
              - list [ref=f13e160]:
